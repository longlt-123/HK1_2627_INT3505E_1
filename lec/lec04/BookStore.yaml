openapi: 3.0.0
info:
  title: bookstore
  description: |
    This is a sample BookStore server.
  termsOfService: http://swagger.io/terms/
  contact:
    email: 
      24021544@vnu.edu.vn
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://vnubook.com/BookStore/1.0.0
  description: vnubook API 
- url: https://bookstore/v1
- url: http://127.0.0.1:5000/BookStore/1.0.0
  description: localhost test
tags:
- name: book
  description: Everything about your books
paths:
  /books:
    get:
      tags:
      - book
      summary: Lấy danh sách toàn bộ sách
      operationId: getBooks
      responses:
        "200":
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
    post:
      tags:
      - book
      summary: Thêm sách mới
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Book"
        required: true
      responses:
        "201":
          description: Đã thêm sách thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
  /books/{book_id}:
    get:
      tags:
      - book
      summary: Lấy thông tin chi tiết một sách theo ID
      operationId: getBookwithID
      parameters:
      - name: book_id
        in: path
        description: ID của sách
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Tìm thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
      - book
      summary: Cập nhật thông tin sách
      description: Ghi đè thông tin cũ bằng một Object Book hoàn toàn mới.
      parameters:
      - name: book_id
        in: path
        description: ID của sách
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Book"
        required: true
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
      - book
      summary: Xóa sách theo ID
      operationId: deleteBookwithID
      parameters:
      - name: book_id
        in: path
        description: ID của sách
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Xóa thành công
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
      - book
      summary: Sửa đổi thông tin của sách
      operationId: modifyBookwithID
      parameters:
      - name: book_id
        in: path
        description: ID của sách
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                status:
                  type: string
        required: true
      responses:
        "200":
          description: Sửa thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    Book:
      required:
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: Data, Structure and Algorithm
        category:
          type: string
          example: Textbook
        status:
          type: string
          description: "Trạng thái sách (available, pending, sold)"
          example: available
  responses:
    BadRequest:
      description: Dữ liệu đầu vào hoặc tham số không hợp lệ (Lỗi 400)
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
                example: INVALID_INPUT
              message:
                type: string
                example: ID phải là một số nguyên dương.
    NotFound:
      description: Không tìm thấy tài nguyên hệ thống (Lỗi 404)
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
                example: NOT_FOUND
              message:
                type: string
                example: Không tìm thấy dữ liệu yêu cầu.