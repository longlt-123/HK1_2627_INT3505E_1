openapi: 3.0.0
info:
  title: Swagger Petstore - 24021552
  description: |
    This is a sample Petstore server.
  termsOfService: http://swagger.io/terms/
  contact:
    email: 24021552@vnu.edu.vn
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/vnu-12e/PetStore/1.0.0
  description: SwaggerHub API Auto Mocking
- url: https://petstore/v1
tags:
- name: pet
  description: Everything about your Pets
- name: store
  description: Access to Petstore orders
- name: user
  description: Operations about user
paths:
  /pets:
    get:
      tags:
      - pet
      summary: Lấy danh sách toàn bộ thú cưng
      operationId: getPets
      responses:
        "200":
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      tags:
      - pet
      summary: Thêm thú cưng mới
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
        required: true
      responses:
        "201":
          description: Đã thêm thú cưng thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/BadRequest"
  /pets/{pet_id}:
    get:
      tags:
      - pet
      summary: Lấy thông tin chi tiết một thú cưng theo ID
      operationId: getPetwithID
      parameters:
      - name: pet_id
        in: path
        description: ID của thú cưng
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Tìm thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/BadRequest"
    put:
      tags:
      - pet
      summary: Cập nhật thông tin thú cưng
      description: Ghi đè thông tin cũ bằng một Object Pet hoàn toàn mới.
      parameters:
      - name: pet_id
        in: path
        description: ID của thú cưng
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
        required: true
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags:
      - pet
      summary: Xóa thú cưng theo ID
      operationId: deletePetwithID
      parameters:
      - name: pet_id
        in: path
        description: ID của thú cưng
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags:
      - pet
      summary: Sửa đổi thông tin của thú cưng
      operationId: modifyPetwithID
      parameters:
      - name: pet_id
        in: path
        description: ID của thú cưng
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                status:
                  type: string
        required: true
      responses:
        "200":
          description: Sửa thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/BadRequest"
components:
  schemas:
    Pet:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: Doggie
        category:
          type: string
          example: Chó
        status:
          type: string
          description: "Trạng thái thú cưng (available, pending, sold)"
          example: available
  responses:
    BadRequest:
      description: Dữ liệu đầu vào hoặc tham số không hợp lệ (Lỗi 400)
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
                example: INVALID_INPUT
              message:
                type: string
                example: ID phải là một số nguyên dương.
    NotFound:
      description: Không tìm thấy tài nguyên hệ thống (Lỗi 404)
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
                example: NOT_FOUND
              message:
                type: string
                example: Không tìm thấy dữ liệu yêu cầu.
